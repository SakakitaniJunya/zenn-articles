<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="50%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- glow blobs -->
  <circle cx="1040" cy="120" r="160" fill="#14b8a6" opacity="0.30" filter="url(#soft)"/>
  <circle cx="120" cy="520" r="200" fill="#3b82f6" opacity="0.22" filter="url(#soft)"/>

  <!-- frame -->
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="url(#card)" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/>

  <!-- badge -->
  <g transform="translate(96, 100)">
    <rect width="280" height="40" rx="20" fill="rgba(20, 184, 166, 0.18)" stroke="rgba(20, 184, 166, 0.75)" stroke-width="1.2"/>
    <text x="140" y="26" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', monospace" font-size="15" font-weight="600" fill="#5eead4" letter-spacing="2.5">C++20 · Qt6 · QWebEngine · 9 章</text>
  </g>

  <!-- title -->
  <text x="96" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="58" font-weight="800" fill="#ffffff">Electron をやめて</text>
  <text x="96" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="58" font-weight="800" fill="#ffffff">C++ / Qt6 で</text>
  <text x="96" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="44" font-weight="700" fill="#5eead4">Markdown エディタを作る</text>

  <!-- subtitle -->
  <text x="96" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="22" font-weight="500" fill="rgba(255,255,255,0.86)">QWebChannel ハイブリッド設計 + LGPL §4(d)(1) 実務</text>
  <text x="96" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="22" font-weight="500" fill="rgba(255,255,255,0.86)">8 つのハマりどころも全て実体験ベース</text>

  <!-- author / brand -->
  <text x="96" y="528" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="20" font-weight="600" fill="rgba(255,255,255,0.95)">@sakaki_creanest</text>
  <text x="96" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="14" fill="rgba(255,255,255,0.65)">CreaNest · AI 駆動開発時代の Markdown 専用 reader</text>

  <!-- big glyph: stylized editor window + bracket -->
  <g transform="translate(820, 240)" opacity="0.95">
    <!-- editor window outline -->
    <rect x="0" y="0" width="240" height="180" rx="14" fill="rgba(0,0,0,0.30)" stroke="rgba(94, 234, 212, 0.85)" stroke-width="3"/>
    <!-- titlebar dots -->
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="40" cy="20" r="5" fill="#fbbf24"/>
    <circle cx="60" cy="20" r="5" fill="#22c55e"/>
    <line x1="0" y1="40" x2="240" y2="40" stroke="rgba(94, 234, 212, 0.55)" stroke-width="1.5"/>
    <!-- markdown lines -->
    <text x="18" y="72" font-family="ui-monospace, 'SF Mono', monospace" font-size="14" fill="#5eead4" font-weight="700">#</text>
    <rect x="40" y="62" width="160" height="12" rx="3" fill="rgba(255,255,255,0.75)"/>
    <text x="18" y="100" font-family="ui-monospace, 'SF Mono', monospace" font-size="14" fill="#fbbf24" font-weight="700">##</text>
    <rect x="44" y="90" width="130" height="10" rx="3" fill="rgba(255,255,255,0.55)"/>
    <rect x="18" y="118" width="200" height="8" rx="3" fill="rgba(255,255,255,0.40)"/>
    <rect x="18" y="134" width="180" height="8" rx="3" fill="rgba(255,255,255,0.40)"/>
    <rect x="18" y="150" width="100" height="8" rx="3" fill="rgba(255,255,255,0.40)"/>
    <!-- C++ tag -->
    <g transform="translate(165, 0)">
      <rect x="0" y="-22" width="80" height="32" rx="8" fill="#5eead4"/>
      <text x="40" y="0" text-anchor="middle" font-family="ui-monospace, 'SF Mono', monospace" font-size="15" font-weight="800" fill="#0b1220">C++ / Qt</text>
    </g>
  </g>
</svg>
