<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1812" width="1280" height="1812">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="50%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="1812" fill="url(#bg)"/>
  <rect width="1280" height="1812" fill="url(#grid)"/>

  <!-- glow blobs -->
  <circle cx="1080" cy="200" r="240" fill="#14b8a6" opacity="0.30" filter="url(#soft)"/>
  <circle cx="200" cy="1600" r="280" fill="#3b82f6" opacity="0.22" filter="url(#soft)"/>
  <circle cx="1150" cy="1500" r="220" fill="#14b8a6" opacity="0.18" filter="url(#soft)"/>

  <!-- frame -->
  <rect x="80" y="100" width="1120" height="1612" rx="40" fill="url(#card)" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>

  <!-- badge -->
  <g transform="translate(140, 168)">
    <rect width="420" height="56" rx="28" fill="rgba(20, 184, 166, 0.18)" stroke="rgba(20, 184, 166, 0.80)" stroke-width="1.5"/>
    <text x="210" y="36" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', monospace" font-size="20" font-weight="700" fill="#5eead4" letter-spacing="3">C++20 · Qt6 · QWebEngine · 9 章</text>
  </g>

  <!-- title (大きく 3 行) -->
  <text x="140" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="100" font-weight="800" fill="#ffffff">Electron を</text>
  <text x="140" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="100" font-weight="800" fill="#ffffff">やめて</text>
  <text x="140" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="100" font-weight="800" fill="#ffffff">C++ / Qt6 で</text>

  <!-- accent line -->
  <rect x="140" y="668" width="80" height="6" rx="3" fill="#5eead4"/>

  <text x="140" y="760" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="68" font-weight="700" fill="#5eead4">Markdown エディタ</text>
  <text x="140" y="848" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="68" font-weight="700" fill="#5eead4">を作る</text>

  <!-- subtitle / hook -->
  <text x="140" y="970" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="32" font-weight="500" fill="rgba(255,255,255,0.92)">QWebChannel ハイブリッド設計</text>
  <text x="140" y="1018" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="32" font-weight="500" fill="rgba(255,255,255,0.92)">+ LGPL §4(d)(1) 実務 + 8 つのハマり</text>

  <!-- big glyph: editor window centered -->
  <g transform="translate(300, 1130)" opacity="0.95">
    <rect x="0" y="0" width="680" height="380" rx="22" fill="rgba(0,0,0,0.40)" stroke="rgba(94, 234, 212, 0.85)" stroke-width="5"/>
    <!-- titlebar -->
    <circle cx="32" cy="32" r="10" fill="#ef4444"/>
    <circle cx="64" cy="32" r="10" fill="#fbbf24"/>
    <circle cx="96" cy="32" r="10" fill="#22c55e"/>
    <line x1="0" y1="68" x2="680" y2="68" stroke="rgba(94, 234, 212, 0.55)" stroke-width="2"/>

    <!-- markdown content -->
    <text x="32" y="124" font-family="ui-monospace, 'SF Mono', monospace" font-size="32" fill="#5eead4" font-weight="700">#</text>
    <rect x="80" y="100" width="450" height="24" rx="6" fill="rgba(255,255,255,0.80)"/>

    <text x="32" y="186" font-family="ui-monospace, 'SF Mono', monospace" font-size="32" fill="#fbbf24" font-weight="700">##</text>
    <rect x="90" y="164" width="380" height="20" rx="5" fill="rgba(255,255,255,0.60)"/>

    <rect x="32" y="220" width="560" height="14" rx="4" fill="rgba(255,255,255,0.40)"/>
    <rect x="32" y="248" width="500" height="14" rx="4" fill="rgba(255,255,255,0.40)"/>
    <rect x="32" y="276" width="540" height="14" rx="4" fill="rgba(255,255,255,0.40)"/>
    <rect x="32" y="304" width="380" height="14" rx="4" fill="rgba(255,255,255,0.40)"/>

    <!-- code block -->
    <rect x="32" y="332" width="280" height="32" rx="6" fill="rgba(15, 118, 110, 0.55)"/>
    <text x="46" y="354" font-family="ui-monospace, 'SF Mono', monospace" font-size="16" fill="#5eead4">$ cmake --build .</text>

    <!-- C++ / Qt tag -->
    <g transform="translate(540, 0)">
      <rect x="0" y="-30" width="140" height="48" rx="12" fill="#5eead4"/>
      <text x="70" y="0" text-anchor="middle" font-family="ui-monospace, 'SF Mono', monospace" font-size="22" font-weight="800" fill="#0b1220">C++ / Qt</text>
    </g>
  </g>

  <!-- author / brand -->
  <g transform="translate(140, 1620)">
    <rect x="0" y="-2" width="6" height="56" rx="3" fill="#5eead4"/>
    <text x="22" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="34" font-weight="700" fill="#ffffff">@sakaki_creanest</text>
    <text x="22" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="20" fill="rgba(255,255,255,0.70)">CreaNest · AI 駆動開発時代の Markdown 専用 reader</text>
  </g>
</svg>
