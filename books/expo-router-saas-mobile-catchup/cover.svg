<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1812" width="1280" height="1812">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2370"/>
      <stop offset="45%" stop-color="#5b67ff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="1812" fill="url(#bg)"/>

  <!-- decorative blobs -->
  <circle cx="1080" cy="180" r="220" fill="#22d3ee" opacity="0.30" filter="url(#soft)"/>
  <circle cx="180" cy="1550" r="260" fill="#a855f7" opacity="0.30" filter="url(#soft)"/>
  <circle cx="1120" cy="1500" r="200" fill="#22d3ee" opacity="0.22" filter="url(#soft)"/>

  <!-- frame -->
  <rect x="80" y="100" width="1120" height="1612" rx="40" fill="url(#card)" stroke="rgba(255,255,255,0.32)" stroke-width="2"/>

  <!-- badge -->
  <g transform="translate(140, 168)">
    <rect width="320" height="56" rx="28" fill="rgba(34, 211, 238, 0.20)" stroke="rgba(34, 211, 238, 0.75)" stroke-width="1.5"/>
    <text x="160" y="36" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="22" font-weight="700" fill="#a5f3fc" letter-spacing="3">EXPO ROUTER 6 · 9 章</text>
  </g>

  <!-- title (大きく 4 行) -->
  <text x="140" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="100" font-weight="800" fill="#ffffff">Next.js から</text>
  <text x="140" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="100" font-weight="800" fill="#ffffff">2 週間で</text>
  <text x="140" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="100" font-weight="800" fill="#ffffff">iOS/Android</text>
  <text x="140" y="740" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="100" font-weight="800" fill="#ffffff">を出す</text>

  <!-- subtitle line (accent) -->
  <rect x="140" y="780" width="80" height="6" rx="3" fill="#fde68a"/>
  <text x="140" y="858" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="64" font-weight="700" fill="#fde68a">Expo Router 実践</text>

  <!-- subtitle / hook -->
  <text x="140" y="970" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="34" font-weight="500" fill="rgba(255,255,255,0.92)">Web SaaS の認証 / API / Tailwind を最大流用</text>
  <text x="140" y="1018" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="34" font-weight="500" fill="rgba(255,255,255,0.92)">10 時間溶かしたハマり 7 つも実話で収録</text>

  <!-- big glyph: phone + web overlap -->
  <g transform="translate(380, 1110)" opacity="0.95">
    <!-- phone -->
    <rect x="0" y="0" width="240" height="380" rx="32" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.85)" stroke-width="5"/>
    <rect x="32" y="64" width="176" height="252" rx="10" fill="rgba(34, 211, 238, 0.40)"/>
    <circle cx="120" cy="350" r="10" fill="rgba(255,255,255,0.75)"/>
    <rect x="56" y="100" width="128" height="14" rx="4" fill="rgba(255,255,255,0.85)"/>
    <rect x="56" y="130" width="100" height="10" rx="3" fill="rgba(255,255,255,0.55)"/>
    <rect x="56" y="155" width="120" height="10" rx="3" fill="rgba(255,255,255,0.55)"/>
    <rect x="56" y="185" width="90" height="10" rx="3" fill="rgba(255,255,255,0.55)"/>

    <!-- web window overlap -->
    <rect x="160" y="-50" width="320" height="220" rx="22" fill="rgba(255,255,255,0.15)" stroke="rgba(253, 230, 138, 0.90)" stroke-width="5"/>
    <circle cx="188" cy="-22" r="9" fill="#ef4444"/>
    <circle cx="214" cy="-22" r="9" fill="#fbbf24"/>
    <circle cx="240" cy="-22" r="9" fill="#22c55e"/>
    <rect x="188" y="22" width="260" height="10" rx="4" fill="rgba(255,255,255,0.70)"/>
    <rect x="188" y="48" width="220" height="10" rx="4" fill="rgba(255,255,255,0.50)"/>
    <rect x="188" y="74" width="180" height="10" rx="4" fill="rgba(255,255,255,0.50)"/>
    <rect x="188" y="100" width="200" height="10" rx="4" fill="rgba(255,255,255,0.50)"/>
    <rect x="188" y="126" width="140" height="10" rx="4" fill="rgba(255,255,255,0.50)"/>
  </g>

  <!-- author / brand -->
  <g transform="translate(140, 1620)">
    <rect x="0" y="-2" width="6" height="56" rx="3" fill="#fde68a"/>
    <text x="22" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="34" font-weight="700" fill="#ffffff">@sakaki_creanest</text>
    <text x="22" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="20" fill="rgba(255,255,255,0.70)">CreaNest · Solo CEO Engineering</text>
  </g>
</svg>
