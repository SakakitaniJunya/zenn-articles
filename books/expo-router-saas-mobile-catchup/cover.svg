<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2370"/>
      <stop offset="55%" stop-color="#5b67ff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative blobs -->
  <circle cx="980" cy="120" r="140" fill="#22d3ee" opacity="0.30" filter="url(#soft)"/>
  <circle cx="1080" cy="540" r="180" fill="#a855f7" opacity="0.28" filter="url(#soft)"/>
  <circle cx="180" cy="540" r="120" fill="#22d3ee" opacity="0.20" filter="url(#soft)"/>

  <!-- frame -->
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="url(#card)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>

  <!-- badge -->
  <g transform="translate(96, 100)">
    <rect width="220" height="40" rx="20" fill="rgba(34, 211, 238, 0.20)" stroke="rgba(34, 211, 238, 0.7)" stroke-width="1.2"/>
    <text x="110" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" fill="#a5f3fc" letter-spacing="2">EXPO ROUTER 6 · 9 章</text>
  </g>

  <!-- title -->
  <text x="96" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="60" font-weight="800" fill="#ffffff">Next.js から 2 週間で</text>
  <text x="96" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="60" font-weight="800" fill="#ffffff">iOS / Android を出す</text>
  <text x="96" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="44" font-weight="700" fill="#fde68a">Expo Router 実践</text>

  <!-- subtitle / hook -->
  <text x="96" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="22" font-weight="500" fill="rgba(255,255,255,0.86)">Web SaaS の認証 / API / Tailwind を最大流用</text>
  <text x="96" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="22" font-weight="500" fill="rgba(255,255,255,0.86)">10 時間溶かしたハマり 7 つも実話で収録</text>

  <!-- author / brand -->
  <text x="96" y="536" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="20" font-weight="600" fill="rgba(255,255,255,0.95)">@sakaki_creanest</text>
  <text x="96" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="14" fill="rgba(255,255,255,0.65)">CreaNest · Solo CEO Engineering</text>

  <!-- big glyph (phone + web) -->
  <g transform="translate(880, 290)" opacity="0.92">
    <!-- phone -->
    <rect x="0" y="0" width="150" height="240" rx="20" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.8)" stroke-width="3"/>
    <rect x="20" y="40" width="110" height="160" rx="6" fill="rgba(34, 211, 238, 0.35)"/>
    <circle cx="75" cy="222" r="6" fill="rgba(255,255,255,0.7)"/>
    <!-- web window overlap -->
    <rect x="90" y="-30" width="180" height="130" rx="14" fill="rgba(255,255,255,0.15)" stroke="rgba(253, 230, 138, 0.85)" stroke-width="3"/>
    <circle cx="106" cy="-15" r="5" fill="#ef4444"/>
    <circle cx="124" cy="-15" r="5" fill="#fbbf24"/>
    <circle cx="142" cy="-15" r="5" fill="#22c55e"/>
    <rect x="106" y="14" width="148" height="6" rx="3" fill="rgba(255,255,255,0.65)"/>
    <rect x="106" y="30" width="120" height="6" rx="3" fill="rgba(255,255,255,0.45)"/>
    <rect x="106" y="46" width="100" height="6" rx="3" fill="rgba(255,255,255,0.45)"/>
  </g>
</svg>
